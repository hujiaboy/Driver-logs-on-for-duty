補錄工具 — 高靈活性版本
<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浚鍵管理有限公司 - 補錄工具</title>
    <!-- 載入 Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 12px; background-color: #f0f2f5; color: #333; }
        .card { background: #ffffff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
        h2 { text-align: center; font-size: 18px; margin: 0 0 12px 0; color: #1a365d; }
        .sub-title { text-align: center; font-size: 13px; color: #e67e22; margin-top: -8px; margin-bottom: 12px; font-weight: bold; }
        label { display: block; font-size: 13px; font-weight: bold; margin-top: 8px; color: #4a5568; }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .btn-save { background-color: #e67e22; color: white; font-weight: bold; border: none; margin-top: 14px; }
        .btn-copy { background-color: #805ad5; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-copy-yesterday { background-color: #2b6cb0; color: white; font-weight: bold; border: none; margin-top: 4px; font-size: 13px; }
        .btn-export { background-color: #2f855a; color: white; font-weight: bold; border: none; margin-top: 8px; }
        .btn-del { background-color: #fed7d7; color: #9b2c2c; border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; }
        .btn-nav { background-color: #e2e8f0; color: #2d3748; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; flex: 1; }
        .btn-mode { background-color: #4a5568; color: white; font-weight: bold; border: none; padding: 8px; border-radius: 8px; font-size: 14px; }
        .btn-mode.active { background-color: #e67e22; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 2px; text-align: center; }
        th { background-color: #edf2f7; color: #2d3748; }
        .summary { font-weight: bold; background-color: #feebc8; font-size: 13px; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .cloud-status { font-size: 11px; text-align: center; color: #2f855a; margin-top: -8px; margin-bottom: 8px; font-weight: bold; }
        .nav-date { display: flex; gap: 8px; align-items: center; }
        .nav-date input { flex: 3; }
        .nav-date button { flex: 1; }
        .copy-section { background: #f7fafc; padding: 8px 12px; border-radius: 8px; margin-top: 4px; font-size: 13px; color: #4a5568; }
        .copy-section span { font-weight: bold; color: #2b6cb0; }
        .btn-group { display: flex; gap: 8px; margin-top: 6px; }
        .btn-group button { flex: 1; margin-top: 0; }
        .mode-indicator { text-align: center; font-size: 14px; font-weight: bold; padding: 6px; border-radius: 6px; margin-bottom: 8px; }
        .mode-indicator.edit { background: #e67e22; color: white; }
        .mode-indicator.view { background: #2b6cb0; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

<h2>浚鍵管理有限公司<br><small style="font-size:14px; font-weight:normal;">📋 補錄工具</small></h2>
<div class="sub-title">🕒 手動輸入日期及時間 · 補錄歷史記錄</div>
<div class="cloud-status" id="cloudStatus">☁️ 雲端狀態：連線中...</div>

<div class="card">
    <!-- 模式切換 -->
    <div class="row" style="margin-bottom:8px;">
        <div>
            <button class="btn-mode active" id="modeEdit" onclick="setMode('edit')">✏️ 補錄模式</button>
        </div>
        <div>
            <button class="btn-mode" id="modeView" onclick="setMode('view')">🔍 查閱模式</button>
        </div>
    </div>

    <!-- 模式指示器 -->
    <div id="modeIndicator" class="mode-indicator edit">✏️ 補錄模式 — 可新增及修改記錄</div>

    <!-- 日期選擇 + 快速導航 -->
    <label style="color:#e67e22;">📅 選擇日期</label>
    <div class="nav-date">
        <button class="btn-nav" onclick="changeDate(-1)">◀ 前一日</button>
        <input type="date" id="recordDate" onchange="switchDate()">
        <button class="btn-nav" onclick="changeDate(1)">後一日 ▶</button>
    </div>

    <!-- 補錄模式輸入區 -->
    <div id="editSection">
        <div class="row">
            <div>
                <label>司機姓名</label>
                <input type="text" id="driverName" placeholder="輸入司機姓名">
            </div>
            <div>
                <label>更次</label>
                <select id="shiftType">
                    <option value="早更">早更</option>
                    <option value="夜更">夜更</option>
                </select>
            </div>
        </div>

        <div style="margin-top:4px;">
            <button class="btn-copy-yesterday" onclick="copyYesterday()">📋 複製前一日相同司機</button>
        </div>

        <div class="row">
            <div>
                <label>⏰ 報到時間</label>
                <input type="time" id="checkInTime">
            </div>
            <div>
                <label>⏰ 簽退時間</label>
                <input type="time" id="checkOutTime">
            </div>
        </div>

        <div class="copy-section">
            💡 <span>快速複製</span> — 點擊下方按鈕複製上一個記錄嘅司機名同更次，只需改時間
        </div>
        <div class="btn-group">
            <button class="btn-copy" onclick="copyLastRecord()">📋 複製上一個記錄（司機+更次）</button>
        </div>

        <button class="btn-save" onclick="saveRecord()">💾 補錄此記錄</button>
    </div>

    <!-- 查閱模式提示 -->
    <div id="viewSection" class="hidden" style="text-align:center; padding:12px; background:#ebf8ff; border-radius:8px;">
        🔍 你現正處於 <strong>查閱模式</strong>，可以查看所選日期嘅所有已補錄記錄，並可刪除或匯出。
    </div>
</div>

<div class="card">
    <h3 style="margin:0 0 8px 0; font-size:15px;">📋 當日記錄</h3>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>司機</th>
                    <th>更次</th>
                    <th>報到</th>
                    <th>簽退</th>
                    <th>時數</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordBody">
                <tr><td colspan="6">今日暫無記錄</td></tr>
            </tbody>
        </table>
    </div>

    <div id="daySummary" class="summary">
        今日記錄：0 條
    </div>

    <button class="btn-export" onclick="exportDayCSV()">📊 匯出當日 CSV</button>
</div>

<script>
    // ============================================================
    // Firebase 設定
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDCrtukTXfEQyJGsmPLH5Zzm0ECgtt8Zuc",
        authDomain: "driver-logs-on-for-duty.firebaseapp.com",
        databaseURL: "https://driver-logs-on-for-duty-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "driver-logs-on-for-duty",
        storageBucket: "driver-logs-on-for-duty.firebasestorage.app",
        messagingSenderId: "932386987991",
        appId: "1:932386987991:web:5728034c18000504feb592",
        measurementId: "G-JJYVPLPF54"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // 全域變數
    // ============================================================
    let currentDate = "";
    let currentDayData = {};
    let activeListener = null;
    let lastRecord = null;
    let currentMode = 'edit'; // 'edit' 或 'view'

    // ============================================================
    // 初始化
    // ============================================================
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('recordDate').value = today;
        const savedShift = localStorage.getItem('rememberedShift_backfill') || '早更';
        document.getElementById('shiftType').value = savedShift;
        switchDate();
        setMode('edit');
    };

    document.getElementById('shiftType').addEventListener('change', function() {
        localStorage.setItem('rememberedShift_backfill', this.value);
    });

    // ============================================================
    // 模式切換
    // ============================================================
    function setMode(mode) {
        currentMode = mode;
        const editBtn = document.getElementById('modeEdit');
        const viewBtn = document.getElementById('modeView');
        const editSection = document.getElementById('editSection');
        const viewSection = document.getElementById('viewSection');
        const indicator = document.getElementById('modeIndicator');

        if (mode === 'edit') {
            editBtn.classList.add('active');
            viewBtn.classList.remove('active');
            editSection.classList.remove('hidden');
            viewSection.classList.add('hidden');
            indicator.className = 'mode-indicator edit';
            indicator.innerText = '✏️ 補錄模式 — 可新增及修改記錄';
        } else {
            viewBtn.classList.add('active');
            editBtn.classList.remove('active');
            editSection.classList.add('hidden');
            viewSection.classList.remove('hidden');
            indicator.className = 'mode-indicator view';
            indicator.innerText = '🔍 查閱模式 — 只可查看、刪除及匯出記錄';
        }
    }

    // ============================================================
    // 日期切換
    // ============================================================
    function changeDate(delta) {
        const dateInput = document.getElementById('recordDate');
        const d = new Date(dateInput.value);
        d.setDate(d.getDate() + delta);
        const newDate = d.toISOString().split('T')[0];
        dateInput.value = newDate;
        switchDate();
    }

    function switchDate() {
        currentDate = document.getElementById('recordDate').value;
        if (!currentDate) return;

        document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：資料同步中...";

        if (activeListener) {
            db.ref('attendance/' + currentDate).off('value', activeListener);
        }

        activeListener = db.ref('attendance/' + currentDate).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentDayData = data;
            } else {
                currentDayData = {};
            }
            renderTable();
            document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：已連線";
        }, (error) => {
            console.error(error);
            document.getElementById('cloudStatus').innerText = "⚠️ 雲端狀態：連線受阻，請檢查 Firebase 權限";
        });
    }

    // ============================================================
    // 複製前一日相同司機
    // ============================================================
    function copyYesterday() {
        if (currentMode === 'view') {
            alert('⚠️ 查閱模式不可補錄，請切換至「補錄模式」。');
            return;
        }

        const driverName = document.getElementById('driverName').value.trim();
        if (!driverName) {
            alert('請先輸入要複製嘅司機姓名！');
            return;
        }

        const dateObj = new Date(currentDate);
        dateObj.setDate(dateObj.getDate() - 1);
        const yesterday = dateObj.toISOString().split('T')[0];

        document.getElementById('cloudStatus').innerText = "☁️ 正在查詢前一日記錄...";

        db.ref('attendance/' + yesterday).once('value').then((snapshot) => {
            const data = snapshot.val();
            if (!data) {
                alert('⚠️ 前一日 (' + yesterday + ') 無任何記錄');
                document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：無記錄";
                return;
            }

            let found = false;
            const keys = Object.keys(data);
            keys.forEach(key => {
                const record = data[key];
                if (record.driverName === driverName) {
                    document.getElementById('shiftType').value = record.shift;
                    found = true;
                }
            });

            if (found) {
                alert('✅ 已複製 ' + driverName + ' 嘅更次設定（' + document.getElementById('shiftType').value + '）\n請手動輸入報到及簽退時間。');
                document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：✅ 已複製前一日設定";
                document.getElementById('checkInTime').focus();
            } else {
                alert('⚠️ 前一日 (' + yesterday + ') 冇 ' + driverName + ' 嘅記錄');
                document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：找不到該司機前一日記錄";
            }
        }).catch((error) => {
            console.error(error);
            alert('⚠️ 讀取前一日記錄失敗，請檢查網絡');
        });
    }

    // ============================================================
    // 複製上一個記錄
    // ============================================================
    function copyLastRecord() {
        if (currentMode === 'view') {
            alert('⚠️ 查閱模式不可補錄，請切換至「補錄模式」。');
            return;
        }

        if (!lastRecord) {
            alert('⚠️ 未有任何已補錄記錄可以複製，請先補錄一條記錄。');
            return;
        }
        document.getElementById('driverName').value = lastRecord.driverName;
        document.getElementById('shiftType').value = lastRecord.shift;
    }

    // ============================================================
    // 補錄記錄
    // ============================================================
    function saveRecord() {
        if (currentMode === 'view') {
            alert('⚠️ 查閱模式不可補錄，請切換至「補錄模式」。');
            return;
        }

        const driverName = document.getElementById('driverName').value.trim();
        const shift = document.getElementById('shiftType').value;
        const checkIn = document.getElementById('checkInTime').value;
        const checkOut = document.getElementById('checkOutTime').value;

        if (!driverName) {
            alert('請輸入司機姓名！');
            return;
        }

        if (!currentDate) {
            alert('請先選擇日期！');
            return;
        }

        if (!checkIn) {
            alert('請輸入報到時間！');
            return;
        }

        if (!checkOut) {
            alert('請輸入簽退時間！');
            return;
        }

        const checkInParts = checkIn.split(':');
        const checkOutParts = checkOut.split(':');
        const inMinutes = parseInt(checkInParts[0]) * 60 + parseInt(checkInParts[1]);
        const outMinutes = parseInt(checkOutParts[0]) * 60 + parseInt(checkOutParts[1]);
        let diffMinutes = outMinutes - inMinutes;
        if (diffMinutes < 0) diffMinutes += 1440;
        const hours = Math.round((diffMinutes / 60) * 10) / 10;

        const key = driverName + '_' + shift;

        if (currentDayData[key]) {
            if (!confirm('⚠️ 該記錄已存在，確定要覆蓋嗎？')) {
                return;
            }
        }

        const record = {
            driverName: driverName,
            shift: shift,
            checkIn: checkIn,
            checkOut: checkOut,
            hours: hours
        };

        db.ref('attendance/' + currentDate + '/' + key).set(record);

        lastRecord = { driverName: driverName, shift: shift };

        document.getElementById('checkInTime').value = '';
        document.getElementById('checkOutTime').value = '';

        document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：✅ 補錄成功！";
        document.getElementById('checkInTime').focus();
    }

    // ============================================================
    // 刪除記錄
    // ============================================================
    function deleteRecord(key) {
        if (!confirm('確定要刪除 ' + key + ' 嘅記錄嗎？')) return;

        delete currentDayData[key];
        db.ref('attendance/' + currentDate + '/' + key).remove();
        document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：🗑️ 已刪除";
    }

    // ============================================================
    // 渲染表格
    // ============================================================
    function renderTable() {
        const tbody = document.getElementById('recordBody');
        tbody.innerHTML = '';

        const keys = Object.keys(currentDayData);
        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">暫無記錄</td></tr>';
            document.getElementById('daySummary').innerHTML = '今日記錄：0 條';
            return;
        }

        let total = 0;
        keys.forEach(key => {
            const r = currentDayData[key];
            total++;

            const row = `<tr>
                <td><strong>${r.driverName}</strong></td>
                <td>${r.shift}</td>
                <td>${r.checkIn || '-'}</td>
                <td>${r.checkOut || '-'}</td>
                <td>${r.hours ? r.hours + 'h' : '-'}</td>
                <td>
                    <button class="btn-del" onclick="deleteRecord('${key}')">刪除</button>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('daySummary').innerHTML = `<strong>今日記錄：${total} 條</strong>`;
    }

    // ============================================================
    // 匯出當日 CSV
    // ============================================================
    function exportDayCSV() {
        const keys = Object.keys(currentDayData);
        if (keys.length === 0) { alert('當日沒有紀錄可匯出'); return; }

        let csv = `\uFEFF日期,${currentDate}\n司機,更次,報到時間,簽退時間,工作時數(h)\n`;

        keys.forEach(key => {
            const r = currentDayData[key];
            csv += `${r.driverName},${r.shift},${r.checkIn||'-'},${r.checkOut||'-'},${r.hours||0}\n`;
        });

        downloadCSV(csv, `補錄記錄_${currentDate}.csv`);
    }

    // ============================================================
    // 工具函數
    // ============================================================
    function downloadCSV(csv, fileName) {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
