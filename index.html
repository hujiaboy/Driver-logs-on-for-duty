<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浚鍵管理有限公司 - 行車及司機管理</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 12px; background: #f0f2f5; }
        .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
        h2 { text-align: center; font-size: 18px; margin: 0 0 4px; color: #1a365d; }
        .sub { text-align: center; font-size: 13px; color: #718096; margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-top: 8px; color: #4a5568; }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .btn-primary { background: #2b6cb0; color: #fff; font-weight: bold; border: none; }
        .btn-success { background: #2f855a; color: #fff; font-weight: bold; border: none; }
        .btn-danger { background: #e67e22; color: #fff; font-weight: bold; border: none; }
        .btn-export { background: #805ad5; color: #fff; font-weight: bold; border: none; }
        .btn-del { background: #fed7d7; color: #9b2c2c; border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; }
        .btn-checkout-small { background: #e67e22; color: #fff; border: none; padding: 4px 6px; border-radius: 4px; font-size: 11px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 2px; text-align: center; }
        th { background: #edf2f7; }
        .summary { background: #feebc8; font-weight: bold; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
        .month-summary { background: #e9d8fd; font-weight: bold; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
        .cloud-status { text-align: center; font-size: 11px; color: #2f855a; margin: -4px 0 8px; font-weight: bold; }
        .nav-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
        .nav-tabs button { flex: 1; padding: 8px; background: #e2e8f0; border: none; font-weight: bold; color: #4a5568; border-radius: 6px; }
        .nav-tabs button.active { background: #2b6cb0; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
        .status-in { background: #bee3f8; color: #2b6cb0; }
        .status-out { background: #fefcbf; color: #975a16; }
        .salary-highlight { color: #e67e22; font-weight: bold; }
        .range-btn-group { display: flex; gap: 4px; margin-top: 4px; }
        .range-btn-group button { flex: 1; padding: 6px; background: #e2e8f0; border: none; font-weight: bold; border-radius: 6px; font-size: 12px; }
        .range-btn-group button.active { background: #2b6cb0; color: #fff; }
        .hidden { display: none; }
        .mt-2 { margin-top: 8px; }
        .flex { display: flex; gap: 8px; }
        .flex > * { flex: 1; }
    </style>
</head>
<body>

<h2>浚鍵管理有限公司<br><small style="font-size:14px; font-weight:normal;">司機報更及補錄系統</small></h2>
<div class="cloud-status" id="cloudStatus">☁️ 雲端狀態：連線中...</div>

<!-- 分頁 -->
<div class="nav-tabs">
    <button id="tab1btn" class="active" onclick="switchTab('tab1')">📝 每日報更</button>
    <button id="tab2btn" onclick="switchTab('tab2')">📆 月度統計</button>
    <button id="tab3btn" onclick="switchTab('tab3')">📋 補錄查閱</button>
</div>

<!-- ========== 分頁1：每日報更 ========== -->
<div id="tab1" class="tab-content active">
    <div class="card">
        <label style="color:#2b6cb0;">📅 選擇日期</label>
        <input type="date" id="attendanceDate" onchange="switchDate()">
        <div class="row">
            <div><label>司機姓名</label><input type="text" id="driverName" placeholder="請輸入司機姓名"></div>
            <div><label>更次</label>
                <select id="shiftType"><option value="早更">早更</option><option value="夜更">夜更</option></select>
            </div>
        </div>
        <div class="row">
            <div><button class="btn-primary" onclick="checkIn()">✅ 報到</button></div>
            <div><button class="btn-danger" onclick="checkOut()">🏁 簽退</button></div>
        </div>
        <div style="font-size:12px; color:#718096; margin-top:6px; text-align:center;">💡 時薪 HK$75 · 簽退自動計算工時及人工</div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px; font-size:15px;">當日出勤紀錄</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr><th>司機</th><th>更次</th><th>報到</th><th>簽退</th><th>時數</th><th>人工 (HKD)</th><th>狀態</th><th>操作</th></tr>
                </thead>
                <tbody id="attendanceBody"><tr><td colspan="8">今日暫無出勤紀錄</td></tr></tbody>
            </table>
        </div>
        <div id="daySummary" class="summary">今日總出勤：0 人次 | 總工時：0 小時 | 總人工：HK$0</div>
        <button class="btn-export" onclick="exportDayCSV()">📊 匯出當日 CSV</button>
    </div>
</div>

<!-- ========== 分頁2：月度統計 ========== -->
<div id="tab2" class="tab-content">
    <div class="card">
        <label>📆 選擇月份</label>
        <input type="month" id="searchMonth">
        <div class="row">
            <div><label>過濾更次</label>
                <select id="searchShift">
                    <option value="ALL">全部</option><option value="早更">早更</option><option value="夜更">夜更</option>
                </select>
            </div>
            <div><label>司機（可選）</label><input type="text" id="monthDriverFilter" placeholder="留空顯示全部"></div>
        </div>
        <button class="btn-primary" onclick="analyzeMonth()">🔎 查詢</button>
    </div>
    <div class="card">
        <h3 style="margin:0 0 8px; font-size:15px;">月度結果</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>日期</th><th>更次</th><th>司機</th><th>報到</th><th>簽退</th><th>時數</th><th>人工 (HKD)</th></tr></thead>
                <tbody id="monthBody"><tr><td colspan="7">請查詢</td></tr></tbody>
            </table>
        </div>
        <div id="monthSummary" class="month-summary">月度總結：請先查詢</div>
        <button class="btn-export" onclick="exportMonthCSV()">📥 匯出月度 CSV</button>
    </div>
</div>

<!-- ========== 分頁3：補錄查閱 ========== -->
<div id="tab3" class="tab-content">
    <div class="card">
        <div class="row">
            <div><button class="btn-primary" onclick="setBackupMode('edit')">✏️ 補錄模式</button></div>
            <div><button class="btn-success" onclick="setBackupMode('view')">🔍 查閱模式</button></div>
        </div>
        <div id="backupModeIndicator" style="text-align:center; font-weight:bold; padding:4px; background:#e67e22; color:#fff; border-radius:6px; margin-top:6px;">✏️ 補錄模式</div>

        <!-- 補錄輸入 -->
        <div id="backupEdit">
            <label style="color:#e67e22;">📅 選擇日期</label>
            <div class="flex">
                <button class="btn-primary" onclick="backupChangeDate(-1)">◀ 前日</button>
                <input type="date" id="backupDate" onchange="backupSwitchDate()">
                <button class="btn-primary" onclick="backupChangeDate(1)">後日 ▶</button>
            </div>
            <div class="row">
                <div><label>司機姓名</label><input type="text" id="backupDriverName" placeholder="輸入司機姓名"></div>
                <div><label>更次</label>
                    <select id="backupShift"><option value="早更">早更</option><option value="夜更">夜更</option></select>
                </div>
            </div>
            <button class="btn-danger" onclick="backupCopyYesterday()" style="margin-top:4px;">📋 複製前一日相同司機</button>
            <div class="row">
                <div><label>⏰ 報到</label><input type="time" id="backupCheckIn"></div>
                <div><label>⏰ 簽退</label><input type="time" id="backupCheckOut"></div>
            </div>
            <button class="btn-danger" onclick="backupCopyLast()" style="margin-top:4px;">📋 複製上一個記錄</button>
            <button class="btn-primary" onclick="backupSave()" style="margin-top:12px;">💾 補錄此記錄</button>
        </div>

        <!-- 查閱區域 -->
        <div id="backupView" class="hidden">
            <div style="background:#ebf8ff; padding:8px; border-radius:8px; margin-bottom:10px; text-align:center;">🔍 選擇日期範圍查閱及導出</div>
            <label>📅 快速範圍</label>
            <div class="range-btn-group">
                <button id="bRangeToday" class="active" onclick="setBackupRange('today')">今日</button>
                <button id="bRangeMonth" onclick="setBackupRange('month')">本月</button>
                <button id="bRangeYear" onclick="setBackupRange('year')">本年</button>
            </div>
            <label style="margin-top:8px;">📅 自訂範圍</label>
            <div class="flex">
                <input type="date" id="backupStart">
                <input type="date" id="backupEnd">
            </div>
            <div class="row">
                <div><label>👤 司機（可選）</label><input type="text" id="backupDriverFilter" placeholder="留空全部"></div>
                <div><label>🔄 更次</label>
                    <select id="backupShiftFilter">
                        <option value="ALL">全部</option><option value="早更">早更</option><option value="夜更">夜更</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" onclick="backupQuery()">🔎 查詢</button>
            <button class="btn-export" onclick="backupExportCSV()" style="margin-top:4px;">📥 導出 CSV（含總計）</button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px; font-size:15px;">📋 查詢結果</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>日期</th><th>更次</th><th>司機</th><th>報到</th><th>簽退</th><th>時數</th><th>人工 (HKD)</th><th>操作</th></tr></thead>
                <tbody id="backupResultBody"><tr><td colspan="8">請選擇範圍並查詢</td></tr></tbody>
            </table>
        </div>
        <div id="backupSummary" class="summary">總記錄：0 條 | 總工時：0 小時 | 總人工：HK$0</div>
    </div>
</div>

<script>
    // ============================================================
    // 🔥 時薪
    // ============================================================
    const HOURLY_RATE = 75;

    // ============================================================
    // Firebase
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDCrtukTXfEQyJGsmPLH5Zzm0ECgtt8Zuc",
        authDomain: "driver-logs-on-for-duty.firebaseapp.com",
        databaseURL: "https://driver-logs-on-for-duty-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "driver-logs-on-for-duty",
        storageBucket: "driver-logs-on-for-duty.firebasestorage.app",
        messagingSenderId: "932386987991",
        appId: "1:932386987991:web:5728034c18000504feb592",
        measurementId: "G-JJYVPLPF54"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // 分頁切換
    // ============================================================
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        document.getElementById(tab + 'btn').classList.add('active');
        if (tab === 'tab1') loadDayData();
        if (tab === 'tab2') loadMonthData();
    }

    // ============================================================
    // 分頁1：每日報更
    // ============================================================
    let currentDate = "";
    let currentDayData = {};
    let dayListener = null;

    function loadDayData() {
        const d = document.getElementById('attendanceDate').value;
        if (d) switchDate();
    }

    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('attendanceDate').value = today;
        document.getElementById('searchMonth').value = today.substring(0,7);
        document.getElementById('backupDate').value = today;
        document.getElementById('backupStart').value = today;
        document.getElementById('backupEnd').value = today;
        switchDate();
        setBackupRange('today');
        setBackupMode('edit');
    };

    function switchDate() {
        currentDate = document.getElementById('attendanceDate').value;
        if (!currentDate) return;
        if (dayListener) db.ref('attendance/'+currentDate).off('value', dayListener);
        dayListener = db.ref('attendance/'+currentDate).on('value', snap => {
            currentDayData = snap.val() || {};
            renderDayTable();
            document.getElementById('cloudStatus').innerText = "☁️ 雲端狀態：已連線";
        }, err => { console.error(err); });
    }

    function checkIn() {
        const name = document.getElementById('driverName').value.trim();
        const shift = document.getElementById('shiftType').value;
        if (!name) { alert('請輸入司機姓名'); return; }
        const key = name + '_' + shift;
        if (currentDayData[key] && currentDayData[key].checkIn) {
            alert('已於 ' + currentDayData[key].checkIn + ' 報到');
            return;
        }
        const now = new Date();
        const t = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
        const record = { driverName:name, shift, checkIn:t, checkOut:'', hours:0, salary:0 };
        currentDayData[key] = record;
        db.ref('attendance/'+currentDate+'/'+key).set(record);
        document.getElementById('driverName').value = '';
        document.getElementById('cloudStatus').innerText = "☁️ ✅ 報到已同步";
    }

    function checkOutFromTable(key) {
        const r = currentDayData[key];
        if (!r || r.checkOut) return;
        const now = new Date();
        const t = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
        const inMin = parseInt(r.checkIn.split(':')[0])*60 + parseInt(r.checkIn.split(':')[1]);
        const outMin = now.getHours()*60 + now.getMinutes();
        let diff = outMin - inMin;
        if (diff < 0) diff += 1440;
        const hours = Math.round((diff/60)*10)/10;
        const salary = Math.round(hours * HOURLY_RATE * 100) / 100;
        r.checkOut = t; r.hours = hours; r.salary = salary;
        db.ref('attendance/'+currentDate+'/'+key).update({ checkOut:t, hours, salary });
        document.getElementById('cloudStatus').innerText = "☁️ ✅ 簽退已同步";
    }

    function checkOut() {
        const name = document.getElementById('driverName').value.trim();
        const shift = document.getElementById('shiftType').value;
        if (!name) { alert('請輸入司機姓名'); return; }
        const key = name + '_' + shift;
        if (!currentDayData[key]) { alert('未報到'); return; }
        if (currentDayData[key].checkOut) { alert('已簽退'); return; }
        checkOutFromTable(key);
    }

    function deleteDayRecord(key) {
        if (!confirm('刪除？')) return;
        delete currentDayData[key];
        db.ref('attendance/'+currentDate+'/'+key).remove();
    }

    function renderDayTable() {
        const tbody = document.getElementById('attendanceBody');
        tbody.innerHTML = '';
        const keys = Object.keys(currentDayData);
        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8">今日暫無出勤紀錄</td></tr>';
            document.getElementById('daySummary').innerHTML = '今日總出勤：0 人次 | 總工時：0 小時 | 總人工：HK$0';
            return;
        }
        let totalPeople=0, totalHours=0, totalSalary=0;
        keys.forEach(key => {
            const r = currentDayData[key];
            totalPeople++;
            totalHours += r.hours || 0;
            totalSalary += r.salary || 0;
            const status = r.checkOut ? '<span class="status-badge status-out">已簽退</span>' : '<span class="status-badge status-in">工作中</span>';
            const btn = r.checkOut ? '' : `<button class="btn-checkout-small" onclick="checkOutFromTable('${key}')">簽退</button>`;
            tbody.innerHTML += `<tr>
                <td><strong>${r.driverName}</strong></td>
                <td>${r.shift}</td>
                <td>${r.checkIn||'-'}</td>
                <td>${r.checkOut||'-'}</td>
                <td>${r.hours ? r.hours+'h' : '-'}</td>
                <td class="salary-highlight">${r.salary ? 'HK$'+r.salary.toFixed(2) : '-'}</td>
                <td>${status}</td>
                <td>${btn} <button class="btn-del" onclick="deleteDayRecord('${key}')">刪除</button></td>
            </tr>`;
        });
        document.getElementById('daySummary').innerHTML =
            `<strong>今日總出勤：${totalPeople} 人次 | 總工時：${totalHours.toFixed(1)} 小時 | 總人工：HK$${totalSalary.toFixed(2)}</strong>`;
    }

    function exportDayCSV() {
        const keys = Object.keys(currentDayData);
        if (keys.length === 0) { alert('冇紀錄可匯出'); return; }
        let csv = `\uFEFF日期,${currentDate}\n司機,更次,報到,簽退,時數,人工(HKD)\n`;
        let th=0, ts=0;
        keys.forEach(key => {
            const r = currentDayData[key];
            const h = r.hours || 0, s = r.salary || 0;
            th += h; ts += s;
            csv += `${r.driverName},${r.shift},${r.checkIn||'-'},${r.checkOut||'-'},${h},${s.toFixed(2)}\n`;
        });
        csv += `\n總計,,, ,${th.toFixed(1)},${ts.toFixed(2)}\n`;
        downloadCSV(csv, `出勤記錄_${currentDate}.csv`);
    }

    // ============================================================
    // 分頁2：月度統計
    // ============================================================
    function loadMonthData() {
        // 預載時自動顯示當月，但由用戶按查詢
    }

    function analyzeMonth() {
        const targetMonth = document.getElementById('searchMonth').value;
        const shift = document.getElementById('searchShift').value;
        const driver = document.getElementById('monthDriverFilter').value.trim();
        if (!targetMonth) { alert('請選擇月份'); return; }
        document.getElementById('cloudStatus').innerText = "☁️ 查詢中...";
        db.ref('attendance').once('value').then(snap => {
            const all = snap.val() || {};
            const tbody = document.getElementById('monthBody');
            tbody.innerHTML = '';
            const dates = Object.keys(all).filter(d => d.startsWith(targetMonth)).sort();
            if (dates.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7">【${targetMonth}】無記錄</td></tr>`;
                document.getElementById('monthSummary').innerHTML = '月度總結：無資料';
                return;
            }
            let totalRec=0, totalH=0, totalS=0;
            dates.forEach(d => {
                const day = all[d];
                Object.keys(day).forEach(key => {
                    const r = day[key];
                    if (driver && r.driverName !== driver) return;
                    if (shift !== 'ALL' && r.shift !== shift) return;
                    totalRec++;
                    totalH += r.hours || 0;
                    totalS += r.salary || 0;
                    tbody.innerHTML += `<tr>
                        <td>${d}</td>
                        <td>${r.shift}</td>
                        <td>${r.driverName}</td>
                        <td>${r.checkIn||'-'}</td>
                        <td>${r.checkOut||'-'}</td>
                        <td>${r.hours ? r.hours+'h' : '-'}</td>
                        <td class="salary-highlight">${r.salary ? 'HK$'+r.salary.toFixed(2) : '-'}</td>
                    </tr>`;
                });
            });
            if (totalRec === 0) {
                tbody.innerHTML = `<tr><td colspan="7">【${targetMonth}】無符合紀錄</td></tr>`;
            }
            document.getElementById('monthSummary').innerHTML =
                `<strong>【${targetMonth}】總結：</strong>總人次 ${totalRec} | 總工時 ${totalH.toFixed(1)}h | 總人工 HK$${totalS.toFixed(2)}`;
            document.getElementById('cloudStatus').innerText = "☁️ 查詢完成";
        });
    }

    function exportMonthCSV() {
        const targetMonth = document.getElementById('searchMonth').value;
        if (!targetMonth) { alert('請先查詢'); return; }
        db.ref('attendance').once('value').then(snap => {
            const all = snap.val() || {};
            const dates = Object.keys(all).filter(d => d.startsWith(targetMonth)).sort();
            if (dates.length === 0) { alert('無資料'); return; }
            let csv = `\uFEFF月份,${targetMonth}\n日期,司機,更次,報到,簽退,時數,人工(HKD)\n`;
            let th=0, ts=0;
            dates.forEach(d => {
                const day = all[d];
                Object.keys(day).forEach(key => {
                    const r = day[key];
                    const h = r.hours || 0, s = r.salary || 0;
                    th += h; ts += s;
                    csv += `${d},${r.driverName},${r.shift},${r.checkIn||'-'},${r.checkOut||'-'},${h},${s.toFixed(2)}\n`;
                });
            });
            csv += `\n總計,,,,,${th.toFixed(1)},${ts.toFixed(2)}\n`;
            downloadCSV(csv, `月度報表_${targetMonth}.csv`);
        });
    }

    // ============================================================
    // 分頁3：補錄查閱
    // ============================================================
    let backupMode = 'edit';
    let backupDate = "";
    let backupDayData = {};
    let backupListener = null;
    let backupLastRecord = null;
    let backupQueryResult = [];

    function setBackupMode(mode) {
        backupMode = mode;
        document.getElementById('backupEdit').classList.toggle('hidden', mode !== 'edit');
        document.getElementById('backupView').classList.toggle('hidden', mode !== 'view');
        const ind = document.getElementById('backupModeIndicator');
        if (mode === 'edit') {
            ind.style.background = '#e67e22';
            ind.innerText = '✏️ 補錄模式';
        } else {
            ind.style.background = '#2b6cb0';
            ind.innerText = '🔍 查閱模式';
        }
    }

    function backupSwitchDate() {
        backupDate = document.getElementById('backupDate').value;
        if (!backupDate) return;
        if (backupListener) db.ref('attendance/'+backupDate).off('value', backupListener);
        backupListener = db.ref('attendance/'+backupDate).on('value', snap => {
            backupDayData = snap.val() || {};
            renderBackupTable(backupDayData);
        });
    }

    function backupChangeDate(delta) {
        const d = new Date(document.getElementById('backupDate').value);
        d.setDate(d.getDate() + delta);
        document.getElementById('backupDate').value = d.toISOString().split('T')[0];
        backupSwitchDate();
    }

    function backupCopyYesterday() {
        if (backupMode !== 'edit') { alert('請切換至補錄模式'); return; }
        const name = document.getElementById('backupDriverName').value.trim();
        if (!name) { alert('請輸入司機姓名'); return; }
        const d = new Date(backupDate);
        d.setDate(d.getDate()-1);
        const y = d.toISOString().split('T')[0];
        db.ref('attendance/'+y).once('value').then(snap => {
            const data = snap.val();
            if (!data) { alert('前一日無記錄'); return; }
            let found = false;
            Object.keys(data).forEach(key => {
                if (data[key].driverName === name) {
                    document.getElementById('backupShift').value = data[key].shift;
                    found = true;
                }
            });
            if (found) alert('已複製 ' + name + ' 嘅更次');
            else alert('前一日冇 ' + name + ' 嘅記錄');
        });
    }

    function backupCopyLast() {
        if (backupMode !== 'edit') { alert('請切換至補錄模式'); return; }
        if (!backupLastRecord) { alert('未有記錄可複製'); return; }
        document.getElementById('backupDriverName').value = backupLastRecord.driverName;
        document.getElementById('backupShift').value = backupLastRecord.shift;
    }

    function backupSave() {
        if (backupMode !== 'edit') { alert('請切換至補錄模式'); return; }
        const name = document.getElementById('backupDriverName').value.trim();
        const shift = document.getElementById('backupShift').value;
        const ci = document.getElementById('backupCheckIn').value;
        const co = document.getElementById('backupCheckOut').value;
        if (!name) { alert('請輸入司機姓名'); return; }
        if (!ci || !co) { alert('請輸入時間'); return; }
        const inMin = parseInt(ci.split(':')[0])*60 + parseInt(ci.split(':')[1]);
        const outMin = parseInt(co.split(':')[0])*60 + parseInt(co.split(':')[1]);
        let diff = outMin - inMin;
        if (diff < 0) diff += 1440;
        const hours = Math.round((diff/60)*10)/10;
        const salary = Math.round(hours * HOURLY_RATE * 100) / 100;
        const key = name + '_' + shift;
        if (backupDayData[key] && !confirm('覆蓋？')) return;
        const rec = { driverName:name, shift, checkIn:ci, checkOut:co, hours, salary };
        db.ref('attendance/'+backupDate+'/'+key).set(rec);
        backupLastRecord = { driverName:name, shift };
        document.getElementById('backupCheckIn').value = '';
        document.getElementById('backupCheckOut').value = '';
        document.getElementById('cloudStatus').innerText = "☁️ ✅ 補錄成功";
    }

    function renderBackupTable(data) {
        const tbody = document.getElementById('backupResultBody');
        tbody.innerHTML = '';
        const keys = Object.keys(data || {});
        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8">暫無記錄</td></tr>';
            document.getElementById('backupSummary').innerHTML = '總記錄：0 條 | 總工時：0 小時 | 總人工：HK$0';
            return;
        }
        let total=0, th=0, ts=0;
        keys.forEach(key => {
            const r = data[key];
            total++;
            th += r.hours || 0;
            ts += r.salary || 0;
            tbody.innerHTML += `<tr>
                <td>${backupDate}</td>
                <td>${r.shift}</td>
                <td><strong>${r.driverName}</strong></td>
                <td>${r.checkIn||'-'}</td>
                <td>${r.checkOut||'-'}</td>
                <td>${r.hours ? r.hours+'h' : '-'}</td>
                <td class="salary-highlight">${r.salary ? 'HK$'+r.salary.toFixed(2) : '-'}</td>
                <td><button class="btn-del" onclick="backupDelete('${key}')">刪除</button></td>
            </tr>`;
        });
        document.getElementById('backupSummary').innerHTML =
            `<strong>總記錄：${total} 條 | 總工時：${th.toFixed(1)} 小時 | 總人工：HK$${ts.toFixed(2)}</strong>`;
    }

    function backupDelete(key) {
        if (!confirm('刪除？')) return;
        delete backupDayData[key];
        db.ref('attendance/'+backupDate+'/'+key).remove();
    }

    // --- 查閱模式 ---
    function setBackupRange(range) {
        document.querySelectorAll('#tab3 .range-btn-group button').forEach(b => b.classList.remove('active'));
        const today = new Date();
        if (range === 'today') {
            document.getElementById('bRangeToday').classList.add('active');
            const d = today.toISOString().split('T')[0];
            document.getElementById('backupStart').value = d;
            document.getElementById('backupEnd').value = d;
        } else if (range === 'month') {
            document.getElementById('bRangeMonth').classList.add('active');
            const y = today.getFullYear();
            const m = String(today.getMonth()+1).padStart(2,'0');
            document.getElementById('backupStart').value = y + '-' + m + '-01';
            const last = new Date(y, today.getMonth()+1, 0).getDate();
            document.getElementById('backupEnd').value = y + '-' + m + '-' + String(last).padStart(2,'0');
        } else if (range === 'year') {
            document.getElementById('bRangeYear').classList.add('active');
            const y = today.getFullYear();
            document.getElementById('backupStart').value = y + '-01-01';
            document.getElementById('backupEnd').value = y + '-12-31';
        }
    }

    function backupQuery() {
        const start = document.getElementById('backupStart').value;
        const end = document.getElementById('backupEnd').value;
        if (!start || !end) { alert('請選擇日期範圍'); return; }
        if (start > end) { alert('開始日期不能大於結束日期'); return; }
        const driver = document.getElementById('backupDriverFilter').value.trim();
        const shift = document.getElementById('backupShiftFilter').value;

        document.getElementById('cloudStatus').innerText = "☁️ 查詢中...";
        db.ref('attendance').once('value').then(snap => {
            const all = snap.val() || {};
            const tbody = document.getElementById('backupResultBody');
            tbody.innerHTML = '';
            const dates = Object.keys(all).filter(d => d >= start && d <= end).sort();
            if (dates.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8">【${start} 至 ${end}】無記錄</td></tr>`;
                document.getElementById('backupSummary').innerHTML = '查詢結果：無資料';
                backupQueryResult = [];
                return;
            }
            let totalRec=0, th=0, ts=0;
            backupQueryResult = [];
            dates.forEach(d => {
                const day = all[d];
                Object.keys(day).forEach(key => {
                    const r = day[key];
                    if (driver && r.driverName !== driver) return;
                    if (shift !== 'ALL' && r.shift !== shift) return;
                    const hours = r.hours || 0;
                    const salary = r.salary || 0;
                    totalRec++;
                    th += hours;
                    ts += salary;
                    backupQueryResult.push({
                        date:d, shift:r.shift, driverName:r.driverName,
                        checkIn:r.checkIn||'-', checkOut:r.checkOut||'-',
                        hours, salary
                    });
                    tbody.innerHTML += `<tr>
                        <td>${d}</td>
                        <td>${r.shift}</td>
                        <td><strong>${r.driverName}</strong></td>
                        <td>${r.checkIn||'-'}</td>
                        <td>${r.checkOut||'-'}</td>
                        <td>${hours ? hours+'h' : '-'}</td>
                        <td class="salary-highlight">${salary ? 'HK$'+salary.toFixed(2) : '-'}</td>
                        <td><button class="btn-del" onclick="backupViewDelete('${d}','${key}')">刪除</button></td>
                    </tr>`;
                });
            });
            if (totalRec === 0) {
                const display = driver || '所有司機';
                tbody.innerHTML = `<tr><td colspan="8">【${start} 至 ${end}】冇「${display}」嘅記錄</td></tr>`;
                document.getElementById('backupSummary').innerHTML = `查詢結果：無「${display}」嘅記錄`;
            } else {
                const display = driver || '所有司機';
                document.getElementById('backupSummary').innerHTML =
                    `<strong>📊 查詢結果（${start} 至 ${end}）</strong><br>` +
                    `司機：<strong>${display}</strong> | 總紀錄：${totalRec} 條 | ` +
                    `總工時：<strong>${th.toFixed(1)}</strong> 小時 | ` +
                    `總人工：<strong>HK$${ts.toFixed(2)}</strong>`;
            }
            document.getElementById('cloudStatus').innerText = "☁️ 查詢完成";
        });
    }

    function backupViewDelete(date, key) {
        if (!confirm('刪除？')) return;
        db.ref('attendance/'+date+'/'+key).remove();
        backupQuery();
    }

    function backupExportCSV() {
        if (backupQueryResult.length === 0) { alert('請先查詢有結果再導出'); return; }
        let csv = `\uFEFF日期,更次,司機,報到,簽退,時數,人工(HKD)\n`;
        let th=0, ts=0;
        backupQueryResult.forEach(r => {
            th += r.hours;
            ts += r.salary;
            csv += `${r.date},${r.shift},${r.driverName},${r.checkIn},${r.checkOut},${r.hours},${r.salary.toFixed(2)}\n`;
        });
        csv += `\n總計,,,,,${th.toFixed(1)},${ts.toFixed(2)}\n`;
        const start = document.getElementById('backupStart').value;
        const end = document.getElementById('backupEnd').value;
        const driver = document.getElementById('backupDriverFilter').value.trim() || '全部司機';
        downloadCSV(csv, `司機工時_${driver}_${start}_至_${end}.csv`);
    }

    // ============================================================
    // 共用工具
    // ============================================================
    function downloadCSV(csv, name) {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
